[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-analyser"
version = "0.1.0"
description = "Metadata-only network traffic analysis for authorised local inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5,<3",
    "matplotlib>=3.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
traffic-analyser = "traffic_analyser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true